services:
  asr-app:
    container_name: tamil-asr-app
    build: .
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./sample_inputs:/home/user/app/sample_inputs:ro
      - ./outputs:/home/user/app/outputs
      - ./models_cache:/home/user/app/models_cache
    restart: unless-stopped
